name: Deploy to www.robfin.no

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Deploy discord-live-status
        run: |
          SERVER_USER="robfin"
          SERVER_HOST="www.robfin.no"
          TARGET_DIR="/home/robfin/Homepage/discord-live-status/public"
          SRC_DIR="discord-live-status/public"

          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" \
            "$SRC_DIR/" \
            "$SERVER_USER@$SERVER_HOST:$TARGET_DIR/"

      - name: Deploy CaseBoard
        run: |
          SERVER_USER="robfin"
          SERVER_HOST="www.robfin.no"
          TARGET_DIR="/home/robfin/Homepage/caseboard"

          # Sync CaseBoard code while protecting node_modules and caseboard.db
          rsync -avz -e "ssh -o StrictHostKeyChecking=no" \
            --exclude='node_modules' \
            --exclude='caseboard.db' \
            caseboard/ \
            "$SERVER_USER@$SERVER_HOST:$TARGET_DIR/"

          # Install any new dependencies and restart PM2
          ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" "
            cd $TARGET_DIR && \
            npm install --omit=dev && \
            pm2 restart caseboard
          "