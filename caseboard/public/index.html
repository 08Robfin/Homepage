<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CaseBoard">
<meta name="theme-color" content="#BA0C2F">
<meta name="format-detection" content="telephone=no">
<title>CaseBoard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --uia-red: #BA0C2F;
    --uia-red-dark: #8C0924;
    --uia-bg: #FFFFFF;
    --uia-blue: #E8F1FA;
    --uia-blue-dark: #CDE0F5;
    --uia-peach: #F4EAE4;
    --text-main: #1A1A1A;
    --text-muted: #595959;
    --line: #EAEAEA;
    --radius-hero: 80px;
    --radius-card: 16px;
    --radius-pill: 999px;
  }
  
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { 
    margin: 0; padding: 0; 
    background: var(--uia-bg); 
    color: var(--text-main); 
    font-family: 'Inter', sans-serif; 
    overflow-x: hidden;
    width: 100%;
  }
  body { min-height: 100vh; display: flex; flex-direction: column; }
  .hidden { display: none !important; }
  button { font-family: inherit; cursor: pointer; border: none; touch-action: manipulation; -webkit-touch-callout: none; user-select: none; }
  input { font-family: inherit; outline: none; }

  /* Clock In Screen */
  #login-screen {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--uia-red); padding: 20px;
  }
  .login-box {
    width: 100%; max-width: 440px; background: var(--uia-bg);
    border-radius: 24px; padding: 40px; box-shadow: 0 20px 50px rgba(0,0,0,0.2);
  }
  .login-title { font-weight: 700; font-size: 32px; color: var(--uia-red); margin: 0 0 8px 0; }
  .login-sub { color: var(--text-muted); font-size: 15px; margin: 0 0 30px 0; line-height: 1.5; }
  
  .profile-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 30px; max-height: 250px; overflow-y: auto; }
  .profile-chip {
    background: var(--uia-blue); border: 1px solid transparent; border-radius: var(--radius-card);
    padding: 14px 18px; font-size: 15px; color: var(--text-main); 
    display: flex; align-items: center; justify-content: space-between;
    transition: all 0.2s; text-align: left; font-weight: 500;
  }
  .profile-chip:hover { background: var(--uia-blue-dark); transform: translateY(-2px); }
  
  .new-profile-row { display: flex; gap: 10px; }
  #new-profile {
    flex: 1; background: #F5F5F5; border: 2px solid transparent; border-radius: var(--radius-pill);
    padding: 14px 20px; font-size: 15px; transition: border 0.2s;
  }
  #new-profile:focus { border-color: var(--uia-red); background: #FFF; }
  
  .btn-primary {
    border-radius: var(--radius-pill); padding: 14px 24px; font-size: 15px; font-weight: 600;
    background: var(--uia-red); color: #FFF; transition: filter 0.2s, transform 0.2s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-primary:hover { filter: brightness(1.1); transform: scale(1.02); }

  /* App Layout */
  #app-screen { display: none; flex: 1; }
  body.app-ready #app-screen { display: block; }
  
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 40px; background: var(--uia-red); color: #FFF;
  }
  .brand-logo { display: flex; align-items: center; gap: 12px; }
  .brand-logo svg { height: 32px; fill: #FFF; }
  .brand-text { font-weight: 700; font-size: 20px; letter-spacing: -0.5px; }
  .switch-btn {
    background: transparent; border: 1px solid rgba(255,255,255,0.4); color: #FFF;
    border-radius: var(--radius-pill); padding: 8px 16px; font-size: 13px; font-weight: 500;
    transition: background 0.2s;
  }
  .switch-btn:hover { background: rgba(255,255,255,0.1); }

  .uia-hero {
    background: var(--uia-red); color: #FFF; padding: 40px 40px 80px;
    border-bottom-left-radius: var(--radius-hero); margin-bottom: 40px;
  }
  .hero-content { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: flex-end;}
  .hero-title { font-size: 42px; font-weight: 700; max-width: 500px; line-height: 1.1; margin: 0 0 16px 0; }
  .hero-subtitle { font-size: 18px; opacity: 0.9; margin: 0; }
  
  .layout {
    display: grid; grid-template-columns: 1fr 380px; gap: 30px; 
    padding: 0 40px 80px; max-width: 1280px; margin: 0 auto;
  }
  @media (max-width: 900px) { 
    .layout { grid-template-columns: 1fr; padding: 0 20px 40px; } 
    .uia-hero { border-bottom-left-radius: 40px; padding: 30px 20px 50px;} 
    .topbar { padding: 15px 20px; } 
  }

  .card { border-radius: var(--radius-card); padding: 30px; margin-bottom: 30px; }
  .card-blue { background: var(--uia-blue); }
  .card-peach { background: var(--uia-peach); }
  .card-white { background: var(--uia-bg); border: 1px solid var(--line); }
  .card-title { font-size: 20px; font-weight: 700; margin: 0 0 20px 0; color: var(--text-main); }

  .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
  .stat-box { background: rgba(255,255,255,0.6); padding: 16px; border-radius: 12px; text-align: center; }
  .stat-val { font-size: 24px; font-weight: 700; color: var(--uia-red); }
  .stat-label { font-size: 12px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; margin-top: 4px; }

  .xp-track { height: 12px; background: rgba(0,0,0,0.06); border-radius: var(--radius-pill); overflow: hidden; margin-top: 16px; }
  .xp-fill { height: 100%; background: var(--uia-red); border-radius: var(--radius-pill); transition: width 0.5s ease; }
  
  .quick-add { display: flex; gap: 10px; margin-bottom: 16px; }
  .quick-btn {
    flex: 1; background: #FFF; border: 1px solid var(--line); border-radius: 8px;
    padding: 10px; font-size: 14px; font-weight: 600; color: var(--text-main); transition: all 0.15s;
  }
  .quick-btn:hover { border-color: var(--uia-red); color: var(--uia-red); }

  #case-minutes {
    width: 100%; background: #FFF; border: 2px solid transparent; border-radius: 12px;
    padding: 16px; font-size: 18px; margin-bottom: 16px; transition: border 0.2s; text-align: center;
  }
  #case-minutes:focus { border-color: var(--uia-red); }

  .tabs { display: flex; gap: 20px; border-bottom: 2px solid var(--line); margin-bottom: 20px; }
  .tab-btn { background: none; font-weight: 600; font-size: 15px; color: var(--text-muted); padding: 10px 0; margin-bottom: -2px; border-bottom: 2px solid transparent; }
  .tab-btn.active { color: var(--uia-red); border-bottom-color: var(--uia-red); }
  
  .list-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 0; border-bottom: 1px solid var(--line); font-size: 15px;
  }
  .list-row:last-child { border-bottom: none; }
  .list-row.is-me { font-weight: 700; color: var(--uia-red); background: rgba(186, 12, 47, 0.08); border-radius: 8px; padding: 14px 10px; margin: 0 -10px; }
  
  .rank-badge {
    background: var(--uia-red); color: white; border-radius: var(--radius-pill);
    padding: 2px 8px; font-size: 12px; font-weight: 700; margin-right: 10px;
  }

  .toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--text-main); color: #FFF; padding: 14px 24px; border-radius: var(--radius-pill);
    font-size: 14px; font-weight: 500; opacity: 0; transition: all 0.3s; pointer-events: none;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2); z-index: 1000;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---- Mobile / iOS "Add to Home Screen" smoothing (touch devices only) ---- */
  @media (pointer: coarse) {
    html, body {
      overscroll-behavior-y: none;
      overscroll-behavior-x: none;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
    }
    input[type=number] {
      -moz-appearance: textfield;
    }
    input[type=number]::-webkit-outer-spin-button,
    input[type=number]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
  }

  /* ---- Small screens (phones) ---- */
  @media (max-width: 600px) {
    #login-screen {
      min-height: 100dvh;
      padding: 16px;
    }
    .login-box { padding: 28px 22px; border-radius: 20px; }
    .login-title { font-size: 26px; }
    .login-sub { font-size: 14px; margin-bottom: 22px; }
    .new-profile-row { flex-direction: column; }
    #new-profile { font-size: 16px; padding: 14px 16px; }
    .new-profile-row .btn-primary { width: 100%; }

    .topbar {
      padding: max(14px, env(safe-area-inset-top)) 16px 14px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .brand-text { font-size: 17px; }
    .topbar-user-label { display: none; }
    .switch-btn { padding: 7px 14px; font-size: 12px; }

    .uia-hero {
      padding: 24px 16px 40px;
      border-bottom-left-radius: 32px;
      margin-bottom: 24px;
    }
    .hero-title { font-size: 26px; }
    .hero-subtitle { font-size: 15px; }

    .layout { gap: 20px; padding: 0 16px 40px; }
    .card { padding: 20px; margin-bottom: 20px; }
    .card-title { font-size: 17px; margin-bottom: 14px; }

    .stats-grid { gap: 10px; margin-bottom: 18px; }
    .stat-box { padding: 12px 6px; }
    .stat-val { font-size: 19px; }
    .stat-label { font-size: 10px; }

    .quick-add { gap: 8px; }
    .quick-btn { padding: 10px 4px; font-size: 13px; }

    #case-minutes { font-size: 16px; padding: 14px; }

    .list-row { font-size: 14px; padding: 12px 0; }

    .toast {
      bottom: max(24px, calc(env(safe-area-inset-bottom) + 14px));
      font-size: 13px;
      padding: 12px 20px;
      max-width: calc(100% - 40px);
      text-align: center;
    }
  }

  @media (max-width: 380px) {
    .quick-btn { font-size: 12px; padding: 8px 2px; }
    .stat-val { font-size: 17px; }
  }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <div class="login-title">CaseBoard</div>
    <div class="login-sub">Velg din profil for å registrere IT-saker og tjene XP.</div>
    <div id="profile-list" class="profile-list"></div>
    
    <p style="font-size: 14px; color: var(--text-muted); margin: 0 0 10px 0; font-weight: 500;">
      Står ikke navnet ditt på listen? Lag ny bruker her:
    </p>

    <div class="new-profile-row">
      <input id="new-profile" type="text" placeholder="Ditt navn..." autocomplete="off" autocapitalize="words" autocorrect="off" />
      <button class="btn-primary" onclick="createProfile()">Clock in →</button>
    </div>
  </div>
</div>

<div id="app-screen">
  <div class="topbar">
    <div class="brand-logo">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <rect x="10" y="20" width="20" height="60" rx="4"/>
        <rect x="40" y="40" width="20" height="40" rx="4"/>
        <rect x="70" y="10" width="20" height="70" rx="4"/>
      </svg>
      <span class="brand-text">CaseBoard</span>
    </div>
    <div style="display: flex; align-items: center; gap: 16px;">
      <span style="font-weight: 600; font-size: 14px;"><span class="topbar-user-label">Innstemplet som:</span> <span data-current-user style="color: #FFD2D9;"></span></span>
      <button class="switch-btn" onclick="logout()">Bytt bruker</button>
    </div>
  </div>

  <header class="uia-hero">
    <div class="hero-content">
      <div>
        <h1 class="hero-title">Velkommen Tilbake, <span data-current-user></span>!</h1>
        <p class="hero-subtitle">Nivå <span data-current-level>0</span>: <strong data-current-title>Lærling</strong></p>
      </div>
    </div>
  </header>

  <main class="layout">
    <div>
      <div class="card card-peach">
        <h2 class="card-title">Din Fremgang</h2>
        
        <div class="stats-grid">
          <div class="stat-box">
            <div class="stat-val" data-total-cases>0</div>
            <div class="stat-label">Saker</div>
          </div>
          <div class="stat-box">
            <div class="stat-val" data-total-mins>0</div>
            <div class="stat-label">Minutter</div>
          </div>
          <div class="stat-box">
            <div class="stat-val"><span data-avg-time>0</span>m</div>
            <div class="stat-label">Snitt/sak</div>
          </div>
        </div>

        <div style="display: flex; justify-content: space-between; font-weight: 600; font-size: 14px;">
          <span>XP: <span data-current-xp>0</span></span>
          <span style="color: var(--text-muted);">Neste nivå: <span data-next-xp>0</span> XP</span>
        </div>
        <div class="xp-track"><div class="xp-fill" data-xp-progress style="width:0%"></div></div>
      </div>

      <div class="card card-blue">
        <h2 class="card-title">Registrer Tidsbruk</h2>
        <div class="quick-add">
          <button class="quick-btn" onclick="addMins(5)">+5 min</button>
          <button class="quick-btn" onclick="addMins(15)">+15 min</button>
          <button class="quick-btn" onclick="addMins(30)">+30 min</button>
        </div>
        <input id="case-minutes" type="number" min="1" max="1000" inputmode="numeric" pattern="[0-9]*" placeholder="0 minutter" />
        <button class="btn-primary" style="width:100%; padding: 18px;" onclick="logCase()">Send inn sak →</button>
      </div>
    </div>

    <div>
      <div class="card card-white">
        <h2 class="card-title">Ledertavle</h2>
        <div class="tabs">
          <button class="tab-btn active" data-leaderboard-period="month">Denne Måneden</button>
          <button class="tab-btn" data-leaderboard-period="lifetime">Totalt</button>
        </div>
        <div id="leaderboard"></div>
      </div>

      <div class="card card-white">
        <h2 class="card-title">Siste Saker</h2>
        <div id="case-feed"></div>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
  const API_BASE = "/caseboard/api";
  let currentUser = localStorage.getItem("caseboard-current-user") || "";
  let currentProfile = null;

  async function api(path, options = {}) {
    const res = await fetch(API_BASE + path, {
      ...options,
      headers: { "Content-Type": "application/json", ...(options.headers || {}) }
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || "API Error");
    return data;
  }

  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    setTimeout(() => el.classList.remove("show"), 3000);
  }

  function addMins(m) {
    const input = document.getElementById("case-minutes");
    const current = parseInt(input.value || 0);
    input.value = current + m;
  }

// Med denne formelen kreves det ~10 125 XP for Level 15.
// Med ca. 100 XP per sak vil du nå Level 15 på ca. 90–100 saker!
function levelFromXp(xp) { 
  return Math.floor(Math.sqrt(Math.max(0, xp) / 45)); 
}

function xpForLevel(l) { 
  return l * l * 45; 
}

function titleForLevel(l) {
  if (l >= 15) return "No-lifer";
  if (l >= 10) return "Case God";
  if (l >= 7)  return "Case Master";
  if (l >= 4)  return "Keyboard Warrior";
  if (l >= 2)  return "Ticket Tinkerer";
  if (l >= 1)  return "Case Rookie";
  return "Ticket Noob";
}

  async function renderLoginScreen() {
    const list = document.getElementById("profile-list");
    try {
      const users = await api("/users");
      list.innerHTML = users.map(u => `
        <button class="profile-chip" onclick="login('${u.username}')">
          <span>${u.username}</span>
          <span style="color: var(--text-muted); font-size: 13px;">Lvl ${levelFromXp(u.xp)} • ${u.xp} XP</span>
        </button>
      `).join("") || '<div style="color:var(--text-muted); font-size:14px;">Ingen profiler enda. Opprett en nedenfor!</div>';
    } catch (err) {
      list.innerHTML = '<div style="color:var(--uia-red)">Feil ved tilkobling til server.</div>';
    }
  }

  async function createProfile() {
    const name = document.getElementById("new-profile").value.trim();
    if (!name) return;
    try {
      await api("/users", { method: "POST", body: JSON.stringify({ username: name }) });
      await login(name);
    } catch (err) { toast(err.message); }
  }

  async function login(username) {
    try {
      currentProfile = await api(`/users/${encodeURIComponent(username)}`);
      currentUser = username;
      localStorage.setItem("caseboard-current-user", username);
      document.getElementById("login-screen").classList.add("hidden");
      document.body.classList.add("app-ready");
      renderAll();
    } catch (err) { toast(err.message); }
  }

  function logout() {
    currentUser = "";
    localStorage.removeItem("caseboard-current-user");
    document.body.classList.remove("app-ready");
    document.getElementById("login-screen").classList.remove("hidden");
    renderLoginScreen();
  }

  function renderAll() {
    if (!currentProfile) return;
    const xp = currentProfile.xp || 0;
    const level = levelFromXp(xp);
    const curLevelXp = xpForLevel(level);
    const nextLevelXp = xpForLevel(level + 1);
    const progress = Math.min(100, Math.max(0, ((xp - curLevelXp) / (nextLevelXp - curLevelXp)) * 100));

    const cases = currentProfile.cases || [];
    const totalCases = cases.length;
    const totalMins = cases.reduce((sum, c) => sum + Number(c.minutes || 0), 0);
    const avgTime = totalCases > 0 ? Math.round(totalMins / totalCases) : 0;

    document.querySelectorAll("[data-current-user]").forEach(e => e.textContent = currentProfile.username);
    document.querySelectorAll("[data-current-xp]").forEach(e => e.textContent = xp);
    document.querySelectorAll("[data-next-xp]").forEach(e => e.textContent = nextLevelXp);
    document.querySelectorAll("[data-current-level]").forEach(e => e.textContent = level);
    document.querySelectorAll("[data-current-title]").forEach(e => e.textContent = titleForLevel(level));
    document.querySelector("[data-xp-progress]").style.width = progress + "%";
    
    document.querySelector("[data-total-cases]").textContent = totalCases;
    document.querySelector("[data-total-mins]").textContent = totalMins;
    document.querySelector("[data-avg-time]").textContent = avgTime;

    const feed = document.getElementById("case-feed");
    feed.innerHTML = cases.slice().map(c => `
      <div class="list-row">
        <span>Sak (${c.minutes} min)</span>
        <span style="color:var(--uia-red); font-weight:600;">+${c.xp} XP</span>
      </div>
    `).join("") || '<div style="color:var(--text-muted); font-size:14px;">Ingen saker loggført enda.</div>';

    const activePeriod = document.querySelector("[data-leaderboard-period].active")?.dataset.leaderboardPeriod || "month";
    renderLeaderboard(activePeriod);
  }

  async function renderLeaderboard(period) {
    try {
      const rows = await api(`/leaderboard/${period}`);
      document.getElementById("leaderboard").innerHTML = rows.map((r, i) => `
        <div class="list-row ${r.username === currentUser ? 'is-me' : ''}">
          <div style="display:flex; align-items:center;">
            <span class="rank-badge">${i+1}</span>
            <span>${r.username}</span>
          </div>
          <span style="font-weight:600;">${r.xp} XP</span>
        </div>
      `).join("");
    } catch (_) {}
  }

  async function logCase() {
    const mins = document.getElementById("case-minutes").value;
    if (!mins || mins <= 0) return;
    
    try {
      currentProfile = await api(`/users/${encodeURIComponent(currentUser)}/cases`, {
        method: "POST",
        body: JSON.stringify({ minutes: mins })
      });
      document.getElementById("case-minutes").value = "";
      toast("Sak registrert!");
      renderAll();
    } catch (err) { toast(err.message); }
  }

  document.querySelectorAll("[data-leaderboard-period]").forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll("[data-leaderboard-period]").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      renderLeaderboard(btn.dataset.leaderboardPeriod);
    };
  });

  document.getElementById("new-profile").addEventListener("keydown", (e) => {
    if (e.key === "Enter") createProfile();
  });

  document.getElementById("case-minutes").addEventListener("keydown", (e) => {
    if (e.key === "Enter") logCase();
  });

async function initApp() {
  await renderLoginScreen();
}

initApp();
</script>
</body>
</html>
