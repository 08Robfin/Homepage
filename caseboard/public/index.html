<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CaseBoard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAFAF9;
    --panel:#FFFFFF;
    --panel-raised:#F3F0EC;
    --tint:#E9F1FA;
    --line:#E3E1DC;
    --text:#1A1A1A;
    --dim:#6B6862;
    --red:#BA0C2F;
    --red-dark:#8C0924;
    --red-tint:#FBE7EA;
    --blue:#2E6B9E;
    --blue-tint:#E7F0FB;
    --radius-hero:20px;
    --radius-card:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
  body{min-height:100vh;}
  .hidden{display:none !important;}
  button{font-family:inherit;cursor:pointer;}
  input{font-family:inherit;}

  #login-screen{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:32px 20px;background:var(--red);
  }
  .login-box{width:100%;max-width:420px;background:var(--panel);border-radius:var(--radius-hero);padding:34px 32px;box-shadow:0 18px 40px rgba(0,0,0,0.18);}
  .login-title{font-family:'Space Grotesk';font-weight:700;font-size:32px;margin:0 0 6px 0;color:var(--red);}
  .login-sub{color:var(--dim);font-size:14px;margin:0 0 26px 0;line-height:1.55;}
  .profile-list{display:flex;flex-direction:column;gap:8px;margin-bottom:22px;max-height:240px;overflow-y:auto;}
  .profile-chip{
    background:var(--tint);border:1px solid var(--line);border-radius:10px;
    padding:10px 14px;font-size:14px;color:var(--text);display:flex;align-items:center;justify-content:space-between;
    transition:border-color .15s,background .15s;text-align:left;
  }
  .profile-chip:hover{border-color:var(--red);background:var(--red-tint);}
  .new-profile-row{display:flex;gap:8px;}
  #new-username{
    flex:1;background:var(--panel);border:1px solid var(--line);border-radius:999px;
    padding:12px 16px;color:var(--text);font-size:14px;outline:none;
  }
  #new-username:focus{border-color:var(--red);}
  .btn{
    border:none;border-radius:999px;padding:12px 20px;font-size:14px;font-weight:600;
    background:var(--red);color:#FFFFFF;transition:filter .15s;
  }
  .btn:hover{filter:brightness(1.12);}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--text);}

  #app-screen{display:none;min-height:100vh;}
  body.app-ready #app-screen{display:block;}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 26px;background:var(--red);color:#fff;
  }
  .brand-name{font-family:'Space Grotesk';font-weight:700;font-size:18px;color:#fff;}
  .switch-btn{background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.35);color:#fff;border-radius:999px;padding:7px 14px;font-size:12px;}

  .layout{
    display:grid;grid-template-columns:340px 1fr;gap:22px;padding:24px 26px 60px;max-width:1180px;margin:0 auto;
  }
  @media (max-width: 860px){ .layout{grid-template-columns:1fr;} }

  .hero-card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-hero);
    padding:26px;margin-bottom:20px;
  }
  .lvl-title{color:var(--red);font-size:14px;font-weight:600;}
  .xp-track{height:8px;background:var(--panel-raised);border-radius:999px;overflow:hidden;margin-top:8px;}
  .xp-fill{height:100%;background:linear-gradient(90deg,var(--red-dark),var(--red));border-radius:999px;}

  .form-card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-card);padding:22px;
  }
  #case-minutes{
    width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:11px 12px;color:var(--text);font-size:15px;outline:none;margin-bottom:12px;
  }
  .panel-card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-card);
    padding:20px;margin-bottom:20px;
  }
  .tabs{display:flex;gap:12px;margin-bottom:16px;}
  .tab-btn{background:none;border:none;font-weight:600;color:var(--dim);padding:4px 0;}
  .tab-btn.active{color:var(--red);border-bottom:2px solid var(--red);}
  
  .leader-row, .case-row{
    display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);
  }
  .leader-row.is-me{font-weight:bold;color:var(--red);}
  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    background:var(--text);color:#fff;padding:10px 20px;border-radius:999px;font-size:13px;
    display:none;
  }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <div class="login-title">CaseBoard</div>
    <div class="login-sub">Select your profile or create a new one to start logging cases.</div>
    <div id="profile-list" class="profile-list"></div>
    <div class="new-profile-row">
      <input id="new-profile" type="text" placeholder="Your name..." />
      <button class="btn" onclick="createProfile()">Clock In</button>
    </div>
  </div>
</div>

<div id="app-screen">
  <div class="topbar">
    <div class="brand-name">CaseBoard</div>
    <div>
      <span data-current-user style="font-weight:bold;margin-right:12px;"></span>
      <button class="switch-btn" onclick="logout()">Switch Profile</button>
    </div>
  </div>

  <div class="layout">
    <div>
      <div class="hero-card">
        <div class="lvl-title"><span data-current-title>Rookie</span> (Level <span data-current-level>0</span>)</div>
        <div class="xp-track"><div class="xp-fill" data-xp-progress style="width:0%"></div></div>
        <div style="margin-top:8px;font-size:12px;color:var(--dim);">
          <span data-current-xp>0</span> XP total
        </div>
      </div>

      <div class="form-card">
        <h3>Log a Case</h3>
        <input id="case-minutes" type="number" min="1" max="1000" placeholder="Minutes spent (e.g. 15)" />
        <button class="btn" id="log-case-button" style="width:100%;" onclick="logCase()">Submit Case</button>
      </div>
    </div>

    <div>
      <div class="panel-card">
        <h3>Leaderboard</h3>
        <div class="tabs">
          <button class="tab-btn active" data-leaderboard-period="month">This Month</button>
          <button class="tab-btn" data-leaderboard-period="lifetime">Lifetime</button>
        </div>
        <div id="leaderboard"></div>
      </div>

      <div class="panel-card">
        <h3>Recent Cases</h3>
        <div id="case-feed"></div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const API_BASE = "/caseboard/api";
  let currentUser = localStorage.getItem("caseboard-current-user") || "";
  let currentProfile = null;

  async function api(path, options = {}) {
    const res = await fetch(API_BASE + path, {
      ...options,
      headers: { "Content-Type": "application/json", ...(options.headers || {}) }
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || "API Error");
    return data;
  }

  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.style.display = "block";
    setTimeout(() => el.style.display = "none", 2500);
  }

  function levelFromXp(xp) { return Math.floor(Math.sqrt(Math.max(0, xp) / 100)); }
  function xpForLevel(l) { return l * l * 100; }
  function titleForLevel(l) {
    if (l >= 10) return "Senior Support";
    if (l >= 5) return "Support Pro";
    if (l >= 1) return "Rookie";
    return "Newcomer";
  }

  async function renderLoginScreen() {
    const list = document.getElementById("profile-list");
    try {
      const users = await api("/users");
      list.innerHTML = users.map(u => `
        <button class="profile-chip" onclick="login('${u.username}')">
          <span><strong>${u.username}</strong></span>
          <span>Lvl ${levelFromXp(u.xp)} · ${u.xp} XP</span>
        </button>
      `).join("") || '<div style="color:var(--dim)">No profiles yet.</div>';
    } catch (err) {
      list.innerHTML = 'Error connecting to server.';
    }
  }

  async function createProfile() {
    const name = document.getElementById("new-profile").value.trim();
    if (!name) return;
    try {
      await api("/users", { method: "POST", body: JSON.stringify({ username: name }) });
      await login(name);
    } catch (err) { toast(err.message); }
  }

  async function login(username) {
    try {
      currentProfile = await api(`/users/${encodeURIComponent(username)}`);
      currentUser = username;
      localStorage.setItem("caseboard-current-user", username);
      document.getElementById("login-screen").classList.add("hidden");
      document.body.classList.add("app-ready");
      renderAll();
    } catch (err) { toast(err.message); }
  }

  function logout() {
    currentUser = "";
    localStorage.removeItem("caseboard-current-user");
    document.body.classList.remove("app-ready");
    document.getElementById("login-screen").classList.remove("hidden");
    renderLoginScreen();
  }

  function renderAll() {
    if (!currentProfile) return;
    const xp = currentProfile.xp || 0;
    const level = levelFromXp(xp);
    const curLevelXp = xpForLevel(level);
    const nextLevelXp = xpForLevel(level + 1);
    const progress = Math.min(100, Math.max(0, ((xp - curLevelXp) / (nextLevelXp - curLevelXp)) * 100));

    document.querySelectorAll("[data-current-user]").forEach(e => e.textContent = currentProfile.username);
    document.querySelectorAll("[data-current-xp]").forEach(e => e.textContent = xp);
    document.querySelectorAll("[data-current-level]").forEach(e => e.textContent = level);
    document.querySelectorAll("[data-current-title]").forEach(e => e.textContent = titleForLevel(level));
    document.querySelector("[data-xp-progress]").style.width = progress + "%";

    const feed = document.getElementById("case-feed");
    feed.innerHTML = (currentProfile.cases || []).map(c => `
      <div class="case-row">
        <span>${c.minutes} min case</span>
        <span style="color:var(--blue)">+${c.xp} XP</span>
      </div>
    `).join("") || "No cases yet.";

    renderLeaderboard("month");
  }

  async function renderLeaderboard(period) {
    try {
      const rows = await api(`/leaderboard/${period}`);
      document.getElementById("leaderboard").innerHTML = rows.map((r, i) => `
        <div class="leader-row ${r.username === currentUser ? 'is-me' : ''}">
          <span>#${i+1} ${r.username}</span>
          <span>${r.xp} XP</span>
        </div>
      `).join("");
    } catch (_) {}
  }

  async function logCase() {
    const mins = document.getElementById("case-minutes").value;
    if (!mins) return;
    try {
      currentProfile = await api(`/users/${encodeURIComponent(currentUser)}/cases`, {
        method: "POST",
        body: JSON.stringify({ minutes: mins })
      });
      document.getElementById("case-minutes").value = "";
      renderAll();
      toast("Case logged!");
    } catch (err) { toast(err.message); }
  }

  document.querySelectorAll("[data-leaderboard-period]").forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll("[data-leaderboard-period]").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      renderLeaderboard(btn.dataset.leaderboardPeriod);
    };
  });

  if (currentUser) login(currentUser);
  else renderLoginScreen();
</script>
</body>
</html>
